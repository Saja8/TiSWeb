<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TiS 2027 mark</title>
  <desc id="desc">A compact TiS mark with a luminous space tether arc.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07172f"/>
      <stop offset="0.52" stop-color="#0b335d"/>
      <stop offset="1" stop-color="#0b6c86"/>
    </linearGradient>
    <linearGradient id="arc" x1="96" y1="360" x2="416" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35e4ff"/>
      <stop offset="1" stop-color="#ffb13b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <path d="M82 334C162 232 262 156 430 105" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M92 342C174 246 270 177 416 132" fill="none" stroke="#d8f7ff" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>
  <circle cx="112" cy="316" r="20" fill="#07172f" stroke="#35e4ff" stroke-width="8"/>
  <circle cx="403" cy="125" r="20" fill="#07172f" stroke="#ffb13b" stroke-width="8"/>
  <text x="256" y="305" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" text-anchor="middle" letter-spacing="-4">TiS</text>
  <text x="256" y="370" fill="#ffb13b" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" text-anchor="middle" letter-spacing="4">2027</text>
</svg>
